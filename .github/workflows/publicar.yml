# Gera o instalador do Windows e publica no GitHub Releases quando a versão do package.json muda.
# (Se a versão já estiver publicada, nada acontece.) O app instalado confere e se atualiza sozinho.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar e publicar o instalador
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escrever as novidades na página da versão
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$V" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).id||'')}catch{console.log('')}})")
          if [ -n "$ID" ] && [ -f build/release-notes.md ]; then
            node -e "console.log(JSON.stringify({body:require('fs').readFileSync('build/release-notes.md','utf8')}))" > corpo.json
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" -d @corpo.json "https://api.github.com/repos/${{ github.repository }}/releases/$ID" > /dev/null
          fi

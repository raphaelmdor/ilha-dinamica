<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src 'self' data:; style-src 'self'; media-src 'self'">
  <title>Ilha Dinâmica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ilha" id="ilha" data-estado="compacta">

    <!-- Compacta: pílula pequena -->
    <div class="vista vista-compacta">
      <div class="lado esq">
        <div class="olhos" data-humor="normal"><i class="olho"></i><i class="olho"></i></div>
      </div>
      <div class="centro" id="textoCompacto"></div>
      <div class="lado dir">
        <span class="ativ" id="ativ"></span>
        <span class="capa-mini" id="capaMini"></span>
        <div class="equalizador" id="eqMini"><i></i><i></i><i></i><i></i></div>
        <span class="timer-mini" id="timerMini"></span>
      </div>
    </div>

    <!-- Expandida: mídia + widgets -->
    <div class="vista vista-expandida">
      <div class="exp-topo">
        <div class="exp-hora"><span id="horaGrande"></span><small id="dataGrande"></small></div>
        <div class="exp-meio">
          <div class="pontos" id="pontos"></div>
          <div class="nome-pagina" id="nomePagina"></div>
        </div>
        <div class="exp-acoes">
          <button class="bt-atualizar" id="botaoAtualizar" hidden title="Instalar a nova versão agora">⬆ Atualizar</button>
          <span class="bateria-mini" id="chipBateria" hidden><span class="bateria"><i id="nivelBateria"></i></span><span id="textoBateria"></span></span>
          <button class="icone-bt" id="botaoBusca" title="Buscar (Alt+Espaço)" aria-label="Buscar no computador"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg></button>
          <button class="icone-bt" id="botaoMic" title="Falar (Ctrl+Alt+Espaço)" aria-label="Falar um comando"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button>
          <button class="icone-bt" id="botaoConfig" title="Configurações" aria-label="Configurações"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
        </div>
      </div>

      <div class="carrossel" id="carrossel">
        <button class="seta esq" id="setaEsq" aria-label="Widget anterior">‹</button>
        <button class="seta dir" id="setaDir" aria-label="Próximo widget">›</button>
        <div class="trilho" id="trilho">

          <section class="pagina" data-widget="inicio" data-titulo="Início">
            <div class="midia" id="blocoMidia">
              <div class="capa-grande" id="capaGrande"></div>
              <div class="info">
                <div class="titulo" id="titulo">Nada tocando</div>
                <div class="artista" id="artista">Diga "ilha, ajuda" para ver os comandos</div>
                <div class="progresso" id="progresso" hidden>
                  <span id="tempoAtual">0:00</span>
                  <div class="trilha" id="trilhaMusica" title="Clique para pular para esse ponto"><i id="preenchimento"></i></div>
                  <span id="tempoTotal">0:00</span>
                </div>
              </div>
              <div class="controles" id="controles">
                <button data-midia="prev" title="Anterior" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
                <button data-midia="toggle" class="principal" id="botaoPlay" title="Tocar/pausar" aria-label="Tocar ou pausar">
                  <svg viewBox="0 0 24 24" class="ic-play"><path d="M8 5v14l11-7z"/></svg>
                  <svg viewBox="0 0 24 24" class="ic-pausa"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                </button>
                <button data-midia="next" title="Próxima" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
              </div>
            </div>
      <div class="controles-rapidos">
        <button class="toggle" id="tgWifi" title="Wi-Fi" aria-label="Wi-Fi">
          <svg viewBox="0 0 24 24"><path d="M12 18.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 14c2 0 3.8.8 5.1 2.1l-1.4 1.4A5.2 5.2 0 0 0 12 16a5.2 5.2 0 0 0-3.7 1.5l-1.4-1.4A7.2 7.2 0 0 1 12 14zm0-4.5c3.3 0 6.2 1.3 8.3 3.5l-1.4 1.4A9.7 9.7 0 0 0 12 11.5c-2.7 0-5.1 1.1-6.9 2.9l-1.4-1.4A11.7 11.7 0 0 1 12 9.5zM12 5c4.5 0 8.6 1.8 11.5 4.8l-1.4 1.4A14.2 14.2 0 0 0 12 7a14.2 14.2 0 0 0-10.1 4.2L.5 9.8A16.2 16.2 0 0 1 12 5z"/></svg>
        </button>
        <button class="toggle" id="tgBt" title="Bluetooth" aria-label="Bluetooth">
          <svg viewBox="0 0 24 24"><path d="M11 2h1l6 5.5-4.5 4.5 4.5 4.5L12 22h-1v-7.6l-4.3 4.3-1.4-1.4L10.6 12 5.3 6.7l1.4-1.4L11 9.6zm2 2.6v5l2.6-2.5zm0 9.8v5l2.6-2.5z"/></svg>
        </button>
        <button class="toggle" id="tgMudo" title="Som" aria-label="Som ou mudo">
          <svg viewBox="0 0 24 24" class="ic-som"><path d="M4 9h4l5-4v14l-5-4H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <svg viewBox="0 0 24 24" class="ic-mudo"><path d="M4 9h4l5-4v14l-5-4H4zm12.3-.7L18.6 10.6 20.9 8.3l1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3z"/></svg>
        </button>
        <button class="toggle" id="tgTema" title="Modo escuro" aria-label="Modo escuro">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z"/></svg>
        </button>
        <div class="sliders">
          <label class="slider" title="Volume">
            <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            <input type="range" id="slVolume" min="0" max="100" value="50" aria-label="Volume">
            <span class="pct" id="pctVolume">50%</span>
          </label>
          <div id="brilhos" class="brilhos">
            <label class="slider indisponivel" title="Seu monitor não aceita ajuste de brilho pelo Windows (ative DDC/CI no menu do monitor)">
              <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
              <input type="range" min="0" max="100" value="50" disabled aria-label="Brilho">
              <span class="pct">—</span>
            </label>
          </div>
        </div>
      </div>
            <div class="linha-inicio">
              <div class="olhos grandes" data-humor="normal"><i class="olho"></i><i class="olho"></i></div>
              <div class="resumo" id="resumoInicio"></div>
              <div class="chip chip-timer" id="chipTimer" hidden>
                <span id="timerGrande"></span>
                <button id="cancelarTimer" title="Cancelar timer" aria-label="Cancelar timer">✕</button>
              </div>
            </div>
          </section>

          <section class="pagina" data-widget="agenda" data-titulo="Agenda">
            <div class="agenda">
              <div class="cal">
                <div class="cal-topo">
                  <button class="mini-bt" id="calAnt" aria-label="Mês anterior">‹</button>
                  <span id="calMes"></span>
                  <button class="mini-bt" id="calProx" aria-label="Próximo mês">›</button>
                </div>
                <div class="cal-semana"><i>D</i><i>S</i><i>T</i><i>Q</i><i>Q</i><i>S</i><i>S</i></div>
                <div class="cal-dias" id="calDias"></div>
              </div>
              <div class="dia">
                <div class="dia-titulo" id="diaTitulo"></div>
                <div class="dia-feriado" id="diaFeriado"></div>
                <ul class="lista" id="listaEventos"></ul>
                <input class="entrada" id="novoEvento" type="text" placeholder="14:30 Dentista" maxlength="80" autocomplete="off">
              </div>
            </div>
          </section>

          <section class="pagina" data-widget="tarefas" data-titulo="Tarefas">
            <div class="cab-widget"><span id="contaTarefas"></span><button class="mini-bt texto" id="limparFeitas">Limpar feitas</button></div>
            <ul class="lista tarefas" id="listaTarefas"></ul>
            <input class="entrada" id="novaTarefa" type="text" placeholder="Nova tarefa e Enter…" maxlength="120" autocomplete="off">
          </section>

          <section class="pagina" data-widget="foco" data-titulo="Foco">
            <div class="foco">
              <div class="anel">
                <svg viewBox="0 0 120 120"><circle class="anel-fundo" cx="60" cy="60" r="52"/><circle class="anel-progresso" id="anelFoco" cx="60" cy="60" r="52"/></svg>
                <div class="anel-centro"><div id="focoTempo">25:00</div><small id="focoFase">Foco</small></div>
              </div>
              <div class="foco-lado">
                <div class="sessoes" id="focoSessoes"></div>
                <div class="foco-botoes">
                  <button class="bt-grande" id="focoPlay">Começar</button>
                  <button class="mini-bt texto" id="focoPular">Pular</button>
                  <button class="mini-bt texto" id="focoZerar">Zerar</button>
                </div>
                <div class="foco-total" id="focoTotal"></div>
              </div>
            </div>
          </section>

          <section class="pagina" data-widget="notas" data-titulo="Notas">
            <textarea class="notas" id="notas" placeholder="Anote qualquer coisa… (salva sozinho)" spellcheck="true"></textarea>
          </section>

          <section class="pagina" data-widget="clima" data-titulo="Clima">
            <div class="clima" id="clima"><div class="vazio">Carregando o clima…</div></div>
          </section>

          <section class="pagina" data-widget="clipboard" data-titulo="Copiados">
            <div class="cab-widget"><span>Clique para copiar de novo</span><button class="mini-bt texto" id="limparClip">Limpar</button></div>
            <ul class="lista clips" id="listaClips"></ul>
          </section>

          <section class="pagina" data-widget="dock" data-titulo="Favoritos">
            <div class="dock" id="dock"></div>
            <div class="dock-busca" id="dockBusca" hidden>
              <input class="entrada" id="dockCampo" type="text" placeholder="Nome do app para adicionar…" autocomplete="off">
              <ul class="lista" id="dockSugestoes"></ul>
            </div>
          </section>

          <section class="pagina" data-widget="bandeja" data-titulo="Bandeja">
            <div class="cab-widget"><span id="bandejaInfo">Arraste arquivos para cá</span><button class="mini-bt texto" id="limparBandeja">Limpar</button></div>
            <div class="bandeja" id="bandeja"></div>
          </section>

          <section class="pagina" data-widget="sistema" data-titulo="Sistema">
            <div class="sistema-box">
              <div class="medidores" id="medidores"></div>
              <div class="discos" id="discos"></div>
            </div>
          </section>

        </div>
      </div>
    </div>

    <!-- Busca (Alt+Espaço) -->
    <div class="vista vista-busca">
      <div class="busca-topo">
        <svg viewBox="0 0 24 24" class="busca-lupa"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input id="campoBusca" type="text" placeholder="Abrir app, arquivo, configuração ou comando…" autocomplete="off" spellcheck="false">
        <span class="busca-dica">esc</span>
      </div>
      <ul class="resultados" id="resultados" role="listbox"></ul>
    </div>

    <!-- Ouvindo -->
    <div class="vista vista-escuta">
      <div class="olhos grandes" data-humor="normal"><i class="olho"></i><i class="olho"></i></div>
      <div class="onda" id="onda"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="transcricao" id="transcricao">Ouvindo…</div>
    </div>

    <!-- Volume / brilho mudados pelo teclado -->
    <div class="vista vista-osd">
      <span class="osd-icone" id="osdIcone">🔊</span>
      <div class="osd-barra"><i id="osdNivel"></i></div>
      <span class="osd-valor" id="osdValor">50%</span>
    </div>

    <!-- Aviso rápido / ajuda -->
    <div class="vista vista-aviso">
      <div class="aviso-icone" id="avisoIcone">✓</div>
      <div class="aviso-texto">
        <div id="avisoTitulo"></div>
        <div class="aviso-sub" id="avisoSub"></div>
      </div>
      <div class="aviso-botoes" id="avisoBotoes"></div>
    </div>
  </div>

  <script src="/vendor/vosk.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
